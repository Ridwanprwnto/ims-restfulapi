<!DOCTYPE html>
<html>
    <head>
        <title>IMS API</title>
        <link href="https://fonts.googleapis.com/css?family=Karla:400" rel="stylesheet" type="text/css">
        <link href="./style.css" rel="stylesheet" type="text/css">
        <script>
            async function fetchServerInfo() {
                const response = await fetch('/api-ims/app/info');
                const data = await response.json();
                
                document.getElementById('webServer').innerText = `Backend: ${data.webServer} Version ${data.apiVersion}`;
                document.getElementById('runtimeInfo').innerText = `Runtime: Bun and Hono`;
                
                const developerName = data.developer;
                const personalWebLink = data.personalWeb;
                document.getElementById('developer').innerText = `Developed By: ${developerName}`;
                document.getElementById('developer').href = personalWebLink;
            }
            window.onload = fetchServerInfo;
        </script>
    </head>
    <body>
        <div class="container">
            <div class="content">
                <div class="title" title="IMS API">IMS API</div>
                <div class="info"><br />
                    <span id="webServer">Backend: xxx version</span> <span><a title="" target="_blank"  href="https://hono.dev/">info</a></span><br />
                    <span id="runtimeInfo">Runtime: xxx version</span> <span><a title="" target="_blank"  href="https://bun.sh/">info</a></span><br />
                      <!-- Document Root: <br /> -->
                </div>
                <div class="opt">
                  <div><a id="developer" title="developer" target="_blank" href="">Getting Started API Path</a></div>
                </div>
            </div>
        </div>
    </body>
</html>
